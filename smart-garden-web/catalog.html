<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Edukasi - Smart Garden</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">

  <script src="./js/auth.js"></script>
  <script>
    protectPage();
  </script>

  <div class="flex flex-col md:flex-row min-h-screen">
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 md:p-10 bg-gray-50 min-h-screen">

      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
        <div>
          <div class="flex items-center gap-3 text-emerald-700 mb-2">
            <i data-lucide="book-open" class="w-6 h-6"></i>
            <span class="font-bold text-sm uppercase tracking-wider">Edukasi Tanaman</span>
          </div>
          <h1 class="text-4xl font-black text-gray-800 tracking-tight">Katalog Tanaman</h1>
          <p class="text-gray-500 mt-2 text-base max-w-2xl">
            Daftar standar data kelembaban ideal tanaman pada sistem IoT Smart Garden.
          </p>
        </div>
        
        <button id="admin-add-btn" onclick="openModal()" class="hidden flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-3 rounded-2xl transition-all active:scale-95 cursor-pointer shadow-md shadow-emerald-600/10 text-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Tambah Tanaman</span>
        </button>
      </div>

      <section class="pb-20">
        <div id="plantContainer" class="grid grid-cols-1 md:grid-cols-3 gap-8">
        </div>
      </section>

    </main>
  </div>

  <div id="crudModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h3 id="modalTitle" class="text-xl font-black text-gray-800">Tambah Tanaman Baru</h3>
        <button onclick="closeModal()" class="p-2 text-gray-400 hover:text-gray-600 rounded-xl hover:bg-gray-200/50 transition-colors cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="plantForm" onsubmit="savePlant(event)" class="p-6 space-y-4">
        <input type="hidden" id="plantId" />
        
        <div>
          <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Nama Tanaman</label>
          <input type="text" id="plantName" required placeholder="Contoh: Strawberry" class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Min. Kelembaban (%)</label>
            <input type="number" id="plantMinMoisture" min="0" max="100" required placeholder="Contoh: 60" class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Max. Kelembaban (%)</label>
            <input type="number" id="plantMaxMoisture" min="0" max="100" required placeholder="Contoh: 75" class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-500 mb-2">URL Foto Tanaman</label>
          <input type="url" id="plantImage" required placeholder="https://images.unsplash.com/..." class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
        </div>

        <div>
          <label class="block text-xs font-gray-500 font-bold uppercase mb-2">Deskripsi & Edukasi Perawatan</label>
          <textarea id="plantDescription" rows="3" required placeholder="Tulis instruksi kebutuhan air singkat tanaman..." class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-end gap-3">
          <button type="button" onclick="closeModal()" class="px-5 py-3 rounded-xl border border-gray-200 text-gray-600 font-semibold hover:bg-gray-50 transition-colors cursor-pointer text-sm">Batal</button>
          <button type="submit" class="px-5 py-3 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700 transition-colors cursor-pointer text-sm">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/catalog.js"></script>
  <script src="./js/sidebar.js"></script>
</body>
</html>

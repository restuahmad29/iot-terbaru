<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Realtime</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">

  <script src="./js/auth.js"></script>
  <script>
    protectPage();
  </script>

  <div class="flex flex-col md:flex-row min-h-screen">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 md:p-10 bg-gray-50 min-h-screen">

      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
          <h1 class="text-4xl font-black text-gray-800 tracking-tight">Monitoring Realtime</h1>
          <p class="text-gray-500 mt-2">Grafik realtime kelembaban tanah</p>
        </div>

        <div class="flex items-center gap-2 bg-green-100 px-4 py-2 rounded-full">
          <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
          <span class="font-semibold text-green-700 text-sm">Live</span>
        </div>
      </div>

      <div id="monitoringSection" class="block">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <p class="text-gray-500 font-semibold text-sm">Rata-rata</p>
            <h2 id="avgMoisture" class="text-5xl font-black text-blue-600 mt-4">--%</h2>
          </div>

          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <p class="text-gray-500 font-semibold text-sm">Tertinggi</p>
            <h2 id="maxMoisture" class="text-5xl font-black text-green-600 mt-4">--%</h2>
          </div>

          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <p class="text-gray-500 font-semibold text-sm">Terendah</p>
            <h2 id="minMoisture" class="text-5xl font-black text-red-500 mt-4">--%</h2>
          </div>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100">
          <h2 class="text-2xl font-black text-gray-800 mb-6">Grafik Kelembaban</h2>
          <div class="relative h-64 md:h-80 w-full">
            <canvas id="moistureChart"></canvas>
          </div>
        </div>
      </div>

      <div id="noDeviceSection" class="hidden bg-white p-8 rounded-3xl shadow-md text-center max-w-md mx-auto mt-10 border border-gray-100">
        <div class="inline-block p-4 bg-amber-50 text-amber-500 rounded-2xl mb-4">
          <i data-lucide="unplug" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-800">Alat Belum Terhubung</h2>
        <p class="text-gray-500 text-sm mt-1 mb-6">Silakan hubungkan nomor seri alat Smart Garden Anda untuk mulai melihat data monitoring.</p>
        
        <form id="activateDeviceForm" class="space-y-3">
          <input type="text" id="serialInput" required placeholder="Contoh: SG-2026-XYZ" 
            class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-green-500 text-center font-bold tracking-widest">
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-3 rounded-xl text-sm transition-colors cursor-pointer">
            Hubungkan Alat Sekarang
          </button>
        </form>
      </div>

    </main>
  </div>

  <script src="./js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/monitoring.js"></script>
  <script src="./js/sidebar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Monitoring</title>

  <link
    rel="stylesheet"
    href="./assets/css/style.css"
  />

</head>

<body class="bg-gray-100">

  <script src="./js/auth.js"></script>

  <script>

    protectPage();

  </script>

  <div class="flex">

    <!-- SIDEBAR -->

    <aside class="
      w-64
      min-h-screen
      bg-green-800
      text-white
      p-6
    ">

      <h1 class="
        text-2xl
        font-black
        mb-10
      ">

        Smart Garden

      </h1>

      <nav class="space-y-3">

        <a
          href="dashboard.html"
          class="
            block
            p-3
            rounded-xl
            hover:bg-green-700
          "
        >
          Dashboard
        </a>

        <a
          href="monitoring.html"
          class="
            block
            p-3
            rounded-xl
            bg-green-700
          "
        >
          Monitoring
        </a>

        <button
          onclick="logout()"
          class="
            w-full
            mt-10
            bg-red-500
            p-3
            rounded-xl
          "
        >

          Logout

        </button>

      </nav>

    </aside>

    <!-- CONTENT -->

    <main class="
      flex-1
      p-6
      md:p-10
    ">

      <div class="
        flex
        justify-between
        items-center
        mb-8
      ">

        <div>

          <h1 class="
            text-4xl
            font-black
            text-gray-800
          ">

            Monitoring Realtime

          </h1>

          <p class="
            text-gray-500
            mt-2
          ">

            Grafik realtime kelembaban tanah

          </p>

        </div>

        <div class="
          flex
          items-center
          gap-2
          bg-green-100
          px-4
          py-2
          rounded-full
        ">

          <div class="
            w-3
            h-3
            bg-green-500
            rounded-full
            animate-pulse
          "></div>

          <span class="
            font-semibold
            text-green-700
          ">

            Live

          </span>

        </div>

      </div>

      <!-- STATISTIC -->

      <div class="
        grid
        grid-cols-1
        md:grid-cols-3
        gap-6
        mb-8
      ">

        <!-- AVG -->

        <div class="
          bg-white
          p-6
          rounded-3xl
          shadow-sm
        ">

          <p class="
            text-gray-500
            font-semibold
          ">

            Rata-rata

          </p>

          <h2
            id="avgMoisture"
            class="
              text-5xl
              font-black
              text-blue-600
              mt-4
            "
          >

            --%

          </h2>

        </div>

        <!-- MAX -->

        <div class="
          bg-white
          p-6
          rounded-3xl
          shadow-sm
        ">

          <p class="
            text-gray-500
            font-semibold
          ">

            Tertinggi

          </p>

          <h2
            id="maxMoisture"
            class="
              text-5xl
              font-black
              text-green-600
              mt-4
            "
          >

            --%

          </h2>

        </div>

        <!-- MIN -->

        <div class="
          bg-white
          p-6
          rounded-3xl
          shadow-sm
        ">

          <p class="
            text-gray-500
            font-semibold
          ">

            Terendah

          </p>

          <h2
            id="minMoisture"
            class="
              text-5xl
              font-black
              text-red-500
              mt-4
            "
          >

            --%

          </h2>

        </div>

      </div>

      <!-- CHART -->

      <div class="
        bg-white
        p-8
        rounded-3xl
        shadow-sm
      ">

        <h2 class="
          text-2xl
          font-black
          mb-8
        ">

          Grafik Kelembaban

        </h2>

        <canvas id="moistureChart"></canvas>

      </div>

    </main>

  </div>

  <script src="./js/api.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="./js/monitoring.js"></script>

</body>
</html>

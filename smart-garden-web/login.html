<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login</title>

  <link
    rel="stylesheet"
    href="./assets/css/style.css"
  />

</head>

<body class="
  bg-gray-100
  min-h-screen
  flex
  items-center
  justify-center
  p-6
">

  <div class="
    bg-white
    p-10
    rounded-3xl
    shadow-xl
    w-full
    max-w-md
  ">

    <h1 class="
      text-4xl
      font-black
      text-green-700
      mb-2
      text-center
    ">

      Smart Garden

    </h1>

    <p class="
      text-gray-500
      text-center
      mb-8
    ">

      Login ke dashboard IoT

    </p>

    <form id="loginForm">

      <div class="mb-4">

        <label class="
          block
          mb-2
          font-semibold
        ">

          Email

        </label>

        <input
          type="email"
          id="email"
          class="
            w-full
            p-4
            rounded-xl
            border
            border-gray-300
            focus:outline-none
            focus:ring-2
            focus:ring-green-500
          "
          placeholder="Masukkan email"
          required
        />

      </div>

      <div class="mb-6">

        <label class="
          block
          mb-2
          font-semibold
        ">

          Password

        </label>

        <input
          type="password"
          id="password"
          class="
            w-full
            p-4
            rounded-xl
            border
            border-gray-300
            focus:outline-none
            focus:ring-2
            focus:ring-green-500
          "
          placeholder="Masukkan password"
          required
        />

      </div>

      <button
        type="submit"
        class="
          w-full
          py-4
          bg-green-600
          hover:bg-green-700
          text-white
          font-bold
          rounded-xl
          transition-all
        "
      >

        Login

      </button>

    </form>

    <p
      id="errorText"
      class="
        text-red-500
        mt-4
        text-center
        hidden
      "
    >
      Login gagal
    </p>

  </div>

  <script src="./js/api.js"></script>

  <script src="./js/auth.js"></script>

  <script src="./js/login.js"></script>

</body>
</html>
